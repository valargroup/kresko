[package]
name = "kresko"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
aws-config = "1"
aws-sdk-s3 = "1"
aws-smithy-types = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cpu-equihash-solver = { package = "zakura-equihash", path = "../../valar/common.iroh-free-smoke/crates/equihash", features = ["solver"] }
dotenvy = "0.15"
futures = "0.3"
rand = "0.9"
rand_distr = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
secp256k1 = "0.29"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false }
# Zakura crates, pinned to a tagged release so Cargo fetches them directly (no
# sibling checkout needed). Cargo.lock pins the exact commit. For local Zakura
# co-development, see .cargo/config.toml.example.
#
# Kept under the `zebra_*` extern names via `package =` so the existing
# `zebra_chain::...` paths throughout this crate keep compiling; Zakura is the
# continuation of these crates under a new name.
zebra-chain = { package = "zakura-chain", path = "../../valar/zakura.iroh-free-smoke/crates/zakura-chain", features = ["internal-miner"] }
zebrad = { package = "zakura", path = "../../valar/zakura.iroh-free-smoke/crates/zakurad" }
zebra-jsonl-trace = { package = "zakura-jsonl-trace", path = "../../valar/zakura.iroh-free-smoke/crates/zakura-jsonl-trace" }
# The Common stack zakura uses (zakura#1093), so the transaction builder signs
# with the NU7 consensus branch id the node enforces.
zcash_primitives = { package = "zakura-primitives", features = ["transparent-inputs"], version = "=2.2.0" }
zcash_protocol = { package = "zakura-protocol", version = "=2.2.0" }
zcash_address = { package = "zakura-address", version = "=2.2.0" }
zcash_transparent = { package = "zakura-transparent", version = "=2.2.0" }
orchard = { package = "zakura-orchard", version = "=2.2.0" }
sapling-crypto = { package = "zakura-sapling-crypto", version = "=2.2.0" }
incrementalmerkletree = "0.8"
shardtree = "0.6"
zcash_note_encryption = "0.4.1"
# 0.14 matches zebra-chain after the Zakura cryptography forks
# (zakura-core/zakura#749). kresko uses `ff` only to read a zebra-chain field
# element, so it tracks that side rather than its own Orchard stack, which is
# still on 0.13.
ff = "0.14"
jubjub = { package = "zakura-jubjub", version = "=2.2.0" }
bls12_381 = { package = "zakura-bls12-381", version = "=2.2.0" }
rand_core_06 = { package = "rand_core", version = "0.6" }
# The Common transaction builder takes rand_core 0.10 RNGs.
rand_core_10 = { package = "rand_core", version = "0.10" }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["sys_rng"] }

